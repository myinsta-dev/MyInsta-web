name: Validate translation catalogs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  catalogs:
    name: Catalog structure and draft checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Validate JSON catalogs and translation invariants
        run: node scripts/validate-catalogs.mjs

      - name: Test catalog and source boundaries
        run: node --test scripts/*.test.mjs
